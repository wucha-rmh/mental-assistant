spring:
  datasource:
    # 生产：用环境变量覆盖（DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD）
    # 本机：真实口令写在 application-local.yaml（已 gitignore），不要写回这个受 git 跟踪的文件
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  profiles:
    include: local
  # 上传文件大小上限（Spring 默认只有 1MB，会让前端的「5MB 提示」名不副实）
  servlet:
    multipart:
      max-file-size: 5MB      # 单个文件上限，与前端 AvatarUploader.vue / ArticleDialog.vue 的 5MB 校验一致
      max-request-size: 10MB  # 单次请求上限
  ai:
    openai:
      chat:
        options:
          model: deepseek-flash
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      base-url: https://api.deepseek.com



#服务器端口
server:
  port: 1236


# JWT配置
jwt:
  # ⚠️ 不再写明文：本机放 application-local.yaml，生产用环境变量 JWT_SECRET（建议 48 位以上随机串）
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀

# 本地文件存储（上传的封面/头像都留在项目内，不依赖外部文件服务器）
file:
  upload-dir: ./uploads  # 相对于后端工作目录，即 backend/uploads；对外访问前缀是 /files/**
  temp-cleanup-cron: "0 30 3 * * ?"  # 过期临时文件（is_temp=1 且 expire_time 已过）的清理时间，默认每天 03:30

# 流式对话（SSE /api/psychological-chat/stream）
stream:
  # 每个 SSE 分块之间的额外延时（毫秒）。默认 10：模型一口气吐一批时摊成逐字感；
  # 配 0 或负数则不加延时，完全跟随模型出词节奏（更快，但可能整段弹出）。
  chunk-delay-ms: 20

# 对话记忆窗口（唯一配置源：窗口裁剪、Redis 镜像 LTRIM、历史回灌三处都读它）
# 同前缀下的 store（memory / redis）只在本机 application-local.yaml 里打开，生产用 CHAT_MEMORY_STORE=redis
chat:
  memory:
    # 窗口最多保留多少条消息，一问一答算 2 条（30 条 ≈ 15 轮对话）
    # 也可以用环境变量覆盖：CHAT_MEMORY_MAX_MESSAGES=60
    max-messages: 30

# 本项目自己的 Redis 命名约定（连哪个 Redis 由 spring.data.redis.* 决定，生产走环境变量）
app:
  redis:
    # 所有 key 的统一前缀：{prefix}chat:{conversationId}、{prefix}analytics:overview::…
    # 本机开发在 application-local.yaml 里覆盖成 mha:dev:，避免与线上同名会话互相覆盖
    key-prefix: "mha:"

